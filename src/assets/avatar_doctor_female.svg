<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Female doctor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#FFE4EE"/>
    </linearGradient>
    <clipPath id="c"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <!-- hair (back) -->
    <path d="M22 50c0-19 11-31 26-31s26 12 26 31v26H22z" fill="#3B2418"/>
    <!-- white coat -->
    <path d="M14 96c2-16 14-25 34-25s32 9 34 25z" fill="#FFFFFF"/>
    <path d="M48 71l-9 25h-4l3-22zM48 71l9 25h4l-3-22z" fill="#E5E7EB"/>
    <!-- scrubs -->
    <path d="M40 72l8 12 8-12z" fill="#7C5CFC"/>
    <!-- neck -->
    <path d="M42 60h12v12a6 6 0 0 1-12 0z" fill="#E8B596"/>
    <!-- face -->
    <ellipse cx="48" cy="46" rx="15" ry="17" fill="#F2C4A5"/>
    <!-- fringe -->
    <path d="M32 44c1-13 8-19 17-19 9 0 15 6 16 16-6-1-13-5-17-11-3 7-9 12-16 14z" fill="#3B2418"/>
    <!-- eyes -->
    <ellipse cx="42" cy="48" rx="1.8" ry="2.1" fill="#2B1B14"/>
    <ellipse cx="54" cy="48" rx="1.8" ry="2.1" fill="#2B1B14"/>
    <!-- cheeks & smile -->
    <circle cx="39" cy="54" r="2.6" fill="#F59CA9" opacity=".45"/>
    <circle cx="57" cy="54" r="2.6" fill="#F59CA9" opacity=".45"/>
    <path d="M43.5 56.5c2.6 2.4 6.4 2.4 9 0" fill="none" stroke="#B4535F" stroke-width="1.6" stroke-linecap="round"/>
    <!-- stethoscope -->
    <path d="M37 74c0 9 5 13 11 13s11-4 11-13" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="48" cy="88" r="3" fill="#F43F8F" stroke="#475569" stroke-width="1.5"/>
  </g>
</svg>
